<!doctype html><html><head><meta charset="utf-8"><title>Sample photo editor</title><style>*{box-sizing:border-box}body{margin:0;background:#191d22;color:#e6eaee;font:16px Arial}header{height:64px;border-bottom:1px solid #39414a;padding:22px}main{display:grid;grid-template-columns:1fr 290px;height:536px}.preview{display:grid;place-items:center;background:radial-gradient(ellipse at 40% 50%,#97b6ab,#405e56 45%,#253331 75%);margin:40px}.preview span{font-size:22px}aside{padding:28px;background:#252b32}h2{font-size:18px;margin:0 0 35px}label{display:block;margin-top:30px;font-size:14px}input{width:100%;margin:15px 0;accent-color:#a2df97}small{color:#aebbc4}</style></head><body><header>Photo Studio &nbsp; / &nbsp; Color adjustments</header><main><div class="preview"><span>Your photo preview</span></div><aside><h2>Adjustments</h2><label>Exposure<input type="range" value="50"></label><label id="contrast">Contrast<input type="range" value="50"></label><label>Saturation<input type="range" value="50"></label><small>Adjust the sliders to change your image.</small></aside></main></body></html>
