<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
<title id="title">Dexterity. A little help. Right where you work.</title><desc id="desc">A mint and forest green cursor companion for understanding, learning and short desktop tasks.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c2924"/><stop offset="1" stop-color="#185442"/></linearGradient><radialGradient id="glow"><stop stop-color="#b2ff79" stop-opacity=".22"/><stop offset="1" stop-color="#b2ff79" stop-opacity="0"/></radialGradient></defs>
<rect width="1440" height="600" rx="30" fill="url(#bg)"/><circle cx="1150" cy="245" r="420" fill="url(#glow)"/>
<g fill="none" stroke="#b8ffd4" stroke-opacity=".13"><circle cx="1150" cy="255" r="170"/><circle cx="1150" cy="255" r="250"/><circle cx="1150" cy="255" r="330"/></g>
<g font-family="Segoe UI,Arial,sans-serif"><text x="70" y="82" fill="#b9ffcf" font-size="26" font-weight="700">dexterity.</text><rect x="243" y="53" width="201" height="35" rx="17" fill="#315c46"/><text x="263" y="76" fill="#e5ffc4" font-size="14" letter-spacing="2">WINDOWS PROTOTYPE</text>
<text x="68" y="198" fill="#f3fff6" font-size="72" font-weight="700" letter-spacing="-3">A little help.</text><text x="68" y="278" fill="#c7ff85" font-size="72" font-weight="700" letter-spacing="-3">Right where you work.</text>
<text x="73" y="335" fill="#c2ddd0" font-size="23">Ask about your screen. Learn the next step. Hand over a task.</text>
<g font-size="18" font-weight="600"><rect x="72" y="389" width="172" height="49" rx="24" fill="#c7ff85"/><text x="105" y="421" fill="#153d2e">01  Understand</text><rect x="258" y="389" width="149" height="49" rx="24" fill="#2b5b48"/><text x="290" y="421" fill="#e8fff0">02  Learn</text><rect x="422" y="389" width="132" height="49" rx="24" fill="#2b5b48"/><text x="452" y="421" fill="#e8fff0">03  Act</text></g>
<text x="73" y="531" fill="#aed2be" font-size="17">HOLD CTRL 3 SECONDS</text><text x="307" y="531" fill="#719e89" font-size="20">→</text><text x="350" y="531" fill="#aed2be" font-size="17">SPEAK</text><text x="438" y="531" fill="#719e89" font-size="20">→</text><text x="480" y="531" fill="#aed2be" font-size="17">HELP BESIDE YOUR CURSOR</text>
<g transform="translate(1080 160) rotate(-12)"><path d="M0 0 Q-8-5-7 9L10 186Q12 203 24 189L62 140 126 153Q144 156 132 142Z" fill="#123e31" stroke="#b9ffcf" stroke-width="7" stroke-linejoin="round"/><path d="M10 22L29 133 53 104 96 116Z" fill="#c7ff85"/><circle cx="134" cy="12" r="17" fill="#c7ff85"/><circle cx="134" cy="12" r="29" fill="none" stroke="#b9ffcf" stroke-opacity=".4"/></g>
<rect x="995" y="410" width="359" height="81" rx="20" fill="#f1fff7"/><text x="1021" y="443" fill="#286346" font-size="13" letter-spacing="2">YOUR CURSOR COMPANION</text><text x="1021" y="472" fill="#153d2e" font-size="20" font-weight="600">One step. A little clearer.</text>
</g></svg>
